name: Build and Deploy AncientCurse

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # Server upload disabled due to router/ISP blocking TCP protocols
      # - name: Upload to server via FTP
      #   env:
      #     FTP_HOST: ${{ secrets.SSH_HOST }}
      #     FTP_USER: ${{ secrets.SSH_USER }}
      #     FTP_PASS: ${{ secrets.FTP_PASS }}
      #     TARGET_DIR: ${{ secrets.TARGET_DIR }}
      #   run: |
      #     JAR=$(ls build/libs | grep '.jar$' | head -n1)
      #     echo "Uploading $JAR via FTP to $FTP_HOST"
      #     curl -T "build/libs/$JAR" \
      #          --user "$FTP_USER:$FTP_PASS" \
      #          "ftp://$FTP_HOST/$TARGET_DIR/ancientcurse.jar"

      - name: Upload JAR to Discord
        if: ${{ success() }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          echo "Available JAR files:"
          ls -la build/libs/
          echo "Looking for main JAR (excluding sources and javadoc)..."
          # First try to find the main JAR by excluding sources/javadoc
          JAR_NAME=$(ls build/libs/ | grep '\.jar$' | grep -v '\-sources\.' | grep -v '\-javadoc\.' | head -n1)
          if [ -z "$JAR_NAME" ]; then
            echo "No main JAR found, falling back to any JAR"
            JAR_NAME=$(ls build/libs/ | grep '\.jar$' | head -n1)
          fi
          echo "Selected JAR: $JAR_NAME"
          echo "Full path: build/libs/$JAR_NAME"
          curl -F "content=🚀 New AncientCurse build ready! File: $JAR_NAME" \
               -F "file=@build/libs/$JAR_NAME" \
               "$DISCORD_WEBHOOK"
